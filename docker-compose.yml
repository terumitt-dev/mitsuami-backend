services:
  db:
    image: postgres:18-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: password

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:prepare && bin/rails s -b 0.0.0.0 -p 3000"
    volumes:
      - tmp:/mitsuami/tmp
      - .:/mitsuami
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password

volumes:
  tmp:
